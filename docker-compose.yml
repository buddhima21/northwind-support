# Local development backend. Defaults are public demo fixtures, never production secrets.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "${ConnectionStrings__Default:-Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False}"
      Jwt__Issuer: "${Jwt__Issuer:-NorthwindSupport.Local}"
      Jwt__Audience: "${Jwt__Audience:-NorthwindSupport.Web}"
      Jwt__SigningKey: "${Jwt__SigningKey:-Northwind_LocalDemo_Only_SigningKey_ChangeOutsideDevelopment_2026!}"
      Jwt__LifetimeMinutes: "${Jwt__LifetimeMinutes:-60}"
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  supportdesk-sql:
